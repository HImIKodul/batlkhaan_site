services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmri
      # Only used when the volume is first initialised. START_LOCAL.sh generates a random value; the fallback exists for old checkouts.
      POSTGRES_PASSWORD: ${MMRI_LOCAL_PG_PASSWORD:-mmri}
      POSTGRES_DB: mmri
    ports:
      # Loopback only: never publish the development database on the LAN (default credentials, real-looking data).
      - "127.0.0.1:55432:5432"
    volumes:
      - mmri_v3_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmri -d mmri"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mmri_v3_local_postgres:
