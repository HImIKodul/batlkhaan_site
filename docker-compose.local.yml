services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmri
      POSTGRES_PASSWORD: mmri
      POSTGRES_DB: mmri
    ports:
      - "55432:5432"
    volumes:
      - mmri_v3_local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmri -d mmri"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  mmri_v3_local_postgres:
