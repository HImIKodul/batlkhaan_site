name: MMRI v2.0.0 Connected Production Certification
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'ops/**'
      - 'deploy/**'
      - '.github/workflows/step7-v2-production-certification.yml'
jobs:
  connected-certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mmri
          POSTGRES_PASSWORD: mmri_ci
          POSTGRES_DB: mmri
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mmri -d mmri"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mmri:mmri_ci@127.0.0.1:5432/mmri?schema=public
      MMRI_INTEGRATION_RESET_OK: YES
      MMRI_ENVIRONMENT: integration
      MMRI_INTEGRATION_ACTIVATE_CANDIDATE: YES
      NODE_ENV: test
      ACCESS_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      PASSWORD_PEPPER: abcdef0123456789abcdef0123456789abcdef0123456789
      AUDIT_HASH_SALT: 00112233445566778899aabbccddeeff0011223344556677
      METRICS_TOKEN: 7766554433221100ffeeddccbbaa99887766554433221100
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Require exact dependency locks
        run: |
          test -f backend/package-lock.json
          test -f frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
      - name: Prisma migrate and import v2.0.0
        run: |
          (cd backend && npx prisma generate && npx prisma migrate deploy && npm run db:import:v2 && npm run db:verify:v2:active)
      - name: Deterministic v2 gates
        run: |
          (cd backend && npm run engine:verify && npm run engine:v2:integration && npm run step11:e2e:profiles && npm run api:static-check && npm run strategy:verify && npm run security:verify && npm run final:verify)
      - name: Semantic typecheck, tests and frontend build
        run: |
          (cd backend && npm run typecheck && npm test)
          (cd frontend && npm run build)
      - name: Connected full-stack/security/browser gate
        run: MMRI_INTEGRATION_RESET_OK=YES bash scripts/step21-live-release-gate.sh
      - name: Production-certification boundary
        run: |
          echo 'Connected PostgreSQL/Prisma/frontend runtime gate passed.'
          echo 'Live QPay, live AI, k6/load, restore drill and real-company pilot remain separate controlled gates unless explicitly run.'
