name: Step 25 Final Release Candidate
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'ops/**'
      - 'deploy/**'
      - '.github/workflows/step25-final-release.yml'
jobs:
  final-connected-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mmri
          POSTGRES_PASSWORD: mmri_ci
          POSTGRES_DB: mmri
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mmri -d mmri"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mmri:mmri_ci@127.0.0.1:5432/mmri?schema=public
      MMRI_INTEGRATION_RESET_OK: YES
      MMRI_ENVIRONMENT: integration
      MMRI_INTEGRATION_ACTIVATE_CANDIDATE: YES
      NODE_ENV: test
      ACCESS_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
      PASSWORD_PEPPER: abcdef0123456789abcdef0123456789abcdef0123456789
      AUDIT_HASH_SALT: 00112233445566778899aabbccddeeff0011223344556677
      METRICS_TOKEN: 7766554433221100ffeeddccbbaa99887766554433221100
      ALLOWED_ORIGINS: http://127.0.0.1:5173
      COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Require reproducible lockfiles
        run: |
          test -f backend/package-lock.json || { echo 'backend/package-lock.json is required'; exit 1; }
          test -f frontend/package-lock.json || { echo 'frontend/package-lock.json is required'; exit 1; }
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Generate Prisma and prepare disposable PostgreSQL
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:import:v2
          npm run db:verify:v2:active
      - name: Final source gates
        run: |
          node scripts/step25-final-release-acceptance-v3.13.mjs
          node scripts/step23-pilot-acceptance-v3.11.mjs
          node scripts/step24-calibration-acceptance-v3.12.mjs
          bash VERIFY_WITHOUT_DB.sh
      - name: Semantic typecheck and tests
        run: |
          (cd backend && npm run typecheck && npm test)
          (cd frontend && npm run build)
      - name: Full customer/security connected gate
        run: MMRI_INTEGRATION_RESET_OK=YES bash scripts/step21-live-release-gate.sh
      - name: Final status
        run: |
          echo 'Connected runtime certified for the tested commit.'
          echo 'Real-company pilot evidence and empirical claims remain separate human/evidence gates.'
