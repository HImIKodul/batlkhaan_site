name: MMRI Step 14 Production Operations
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ops/**'
      - 'deploy/**'
      - 'load/**'
      - 'scripts/step13-**'
      - 'scripts/step14-**'
      - '.github/workflows/step14-production-operations.yml'
jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mmri
          POSTGRES_PASSWORD: mmri
          POSTGRES_DB: mmri_step14
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mmri -d mmri_step14"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://mmri:mmri@127.0.0.1:5432/mmri_step14?schema=public
      NODE_ENV: test
      MMRI_INTEGRATION_RESET_OK: YES
      MMRI_ENVIRONMENT: integration
      CHROMIUM_BIN: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install connected tools
        run: sudo apt-get update && sudo apt-get install -y chromium postgresql-client
      - name: Verify reproducible lockfiles
        run: node ops/verify-lockfiles.mjs
      - name: Install backend
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Step 13 security source gate
        working-directory: backend
        run: npm run step13:security:verify
      - name: Step 14 operations source/runtime gate
        working-directory: backend
        run: npm run step14:operations:verify
      - name: Production preflight contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://mmri:mmri@db.internal:5432/mmri?schema=public
          ACCESS_TOKEN_SECRET: ci-access-secret-012345678901234567890123456789
          PASSWORD_PEPPER: ci-password-pepper-012345678901234567890123456789
          AUDIT_HASH_SALT: ci-audit-hash-salt-012345678901234567890123456789
          METRICS_TOKEN: ci-metrics-token-012345678901234567890123456789
          ALLOWED_ORIGINS: https://mmri.example.invalid
          COOKIE_SECURE: 'true'
          TRUST_PROXY: 'true'
          RELEASE_SHA: 1234567890abcdef
          INSTANCE_ID: ci-step14
          MMRI_API_IMAGE: ghcr.io/example/mmri-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MMRI_WEB_IMAGE: ghcr.io/example/mmri-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          MMRI_MIGRATE_IMAGE: ghcr.io/example/mmri-migrate@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          MMRI_BILLING_PROVIDER: qpay
          MMRI_BILLING_ENFORCEMENT: 'true'
          MMRI_DIAGNOSTIC_PRICE_MNT: '100000'
          QPAY_CLIENT_ID: ci-qpay-client
          QPAY_CLIENT_SECRET: ci-qpay-secret
          QPAY_INVOICE_CODE: CI_INVOICE
          QPAY_BASE_URL: https://merchant.qpay.mn
          MMRI_BILLING_CALLBACK_BASE_URL: https://mmri.example.invalid
        run: node ops/preflight.mjs
      - name: Production builds
        run: |
          (cd backend && npm run build:prod)
          (cd frontend && npm run build)
      - name: Build hardened images
        run: |
          docker build -f backend/Dockerfile.production backend -t mmri-api:step14
          docker build -f backend/Dockerfile.migrate backend -t mmri-migrate:step14
          docker build -f frontend/Dockerfile.production frontend -t mmri-web:step14
      - name: Connected operations/security/backup-restore gate
        env:
          MMRI_INTEGRATION_RESET_OK: YES
          RELEASE_SHA: 1234567890abcdef
        run: bash scripts/step14-live-ops-gate.sh
      - name: Upload Step 14 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step14-audit
          path: STEP14_AUDIT
