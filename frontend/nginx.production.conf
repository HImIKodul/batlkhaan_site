server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # A company logo travels Base64-encoded in JSON (up to 2,300,000 bytes); the nginx default of 1 MB would answer 413.
  client_max_body_size 3m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: https://qpay.mn; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    proxy_connect_timeout 5s;
  }
  # expires (unlike add_header) keeps the security headers inherited from the server block.
  location = /index.html { expires -1; }
  location / { try_files $uri $uri/ /index.html; }
}
